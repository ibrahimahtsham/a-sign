<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show me a sign</title>
<meta name="description" content="Press the star and read one ayah of the Quran, with its English translation.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Show me a sign">
<meta property="og:description" content="Press the star and read one ayah of the Quran, with its English translation.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-60 -60 120 120'%3E%3Crect x='-60' y='-60' width='120' height='120' rx='26'/%3E%3Cg fill='white'%3E%3Cpath d='M-30-30h60v60h-60z'/%3E%3Cpath d='M-30-30h60v60h-60z' transform='rotate(45)'/%3E%3C/g%3E%3C/svg%3E">
<script>(function(d){var get=function(k){try{return localStorage.getItem(k)}catch(e){}};if(get('theme')==='light')d.theme='light';
// Follow the device's reduced-motion setting unless the visitor turned animation on here.
if(matchMedia('(prefers-reduced-motion: reduce)').matches){d.reduced='';if(get('motion')!=='on')d.motion='off'}})(document.documentElement.dataset)</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500&family=Alegreya:ital,wght@0,400;1,400&family=Amiri+Quran&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-state="start">
<canvas id="sky" aria-hidden="true"></canvas>

<button id="motion" type="button">Turn on animation</button>
<button id="theme" type="button" aria-label="Switch to light mode">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.75a8.25 8.25 0 0 1 0 16.5z" fill="currentColor"/></svg>
</button>

<main id="stage" aria-live="polite">
  <article id="verse" hidden>
    <p id="arabic" lang="ar" dir="rtl"></p>
    <p id="english"></p>
    <footer id="source">
      <p id="ref"></p>
      <p class="actions">
        <a id="context" target="_blank" rel="noopener">Read in context</a>
        <button id="copy" type="button">Copy</button>
      </p>
    </footer>
  </article>
</main>

<div id="fade" aria-hidden="true"></div>

<button id="sign" type="button">
  <svg viewBox="-100 -100 200 200" aria-hidden="true">
    <g class="sq a"><path pathLength="1" d="M-60-60H60V60H-60Z"/></g>
    <g class="sq b"><path pathLength="1" d="M-60-60H60V60H-60Z"/></g>
    <circle class="core" r="4"/>
  </svg>
  <span id="label">Show me a sign</span>
</button>

<p id="intro">In Arabic, <i lang="ar-Latn">āyah</i> means both a verse of the Quran and a sign.</p>
<p id="credit">Quran text from <a href="https://tanzil.net" target="_blank" rel="noopener">Tanzil</a>, translation by Saheeh International</p>

<script src="app.js" defer></script>
</body>
</html>
